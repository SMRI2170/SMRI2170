name: Update profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile-dashboard.yml"
      - "scripts/update_profile_dashboard.py"

permissions:
  contents: write

concurrency:
  group: profile-main-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate dashboard assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/update_profile_dashboard.py

      - name: Commit changed assets only
        shell: bash
        run: |
          if git diff --quiet -- assets/profile/generated/; then
            echo "Dashboard assets unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/generated/
          git commit -m "chore: refresh profile dashboard"
          git pull --rebase origin main
          git push

name: Update public build log

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-public-build-log.yml"
      - "scripts/update_public_build_log.py"

permissions:
  contents: write

concurrency:
  group: profile-main-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh Public Build Log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
          PROFILE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_public_build_log.py

      - name: Commit only when README changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No profile activity changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh public build log"
          git pull --rebase origin main
          git push

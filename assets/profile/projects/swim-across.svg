<svg width="720" height="320" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="720" height="320" fill="#090C16"/>
  <rect x="18" y="18" width="684" height="284" fill="#10162A" stroke="#F4F7FF" stroke-width="4"/>
  <rect x="28" y="28" width="664" height="264" fill="none" stroke="#2D385A" stroke-width="2"/>
  <text x="50" y="58" fill="#4DD7FF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="800">SAVE 03 // CLEARED</text>
  <rect x="630" y="44" width="12" height="12" fill="#60A5FA"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></rect>
  <g transform="translate(300 132)" fill="#4DD7FF"><rect x="0" y="20" width="72" height="8"/><rect x="12" y="8" width="16" height="12"/><rect x="28" y="0" width="12" height="12"/><rect x="42" y="8" width="18" height="8"/><rect x="8" y="36" width="18" height="6"/><rect x="34" y="36" width="18" height="6"/><rect x="60" y="36" width="18" height="6"/></g>

name: Validate shared CI workflows
on:
  pull_request:
    paths:
      - '.github/workflows/reusable-*.yml'
      - '.github/workflows/validate-shared-ci.yml'
      - 'docs/shared-ci.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reusable-*.yml'
      - '.github/workflows/validate-shared-ci.yml'
permissions:
  contents: read
jobs:
  actionlint:
    name: actionlint workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.7'
          cache: false
      - name: Validate all shared workflows and validator
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/reusable-*.yml .github/workflows/validate-shared-ci.yml
